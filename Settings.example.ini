; settings.example.ini - EXAMPLE ONLY (dummy values)
; Copy this file, rename the copy to settings.ini, and fill in your own Tally names.
; Names must match Tally exactly (Tally ignores capitals, but not spelling).

[tally]
url = http://localhost:9000
company = TEST COMPANY
voucher_type = Sales
; Either one sales ledger for all bills ...
sales_ledger = Sales
; ... or BOTH of these: the program picks one from the bill's tax (CGST+SGST or IGST)
;sales_ledger_local = Sales Local 18%
;sales_ledger_igst = Sales IGST 18%
; {no} = ERP bill number, {fy} = financial year from the bill date (for example 26-27)
voucher_number_format = DEMO/{no}/{fy}
unit = SQM
party_group = Sundry Debtors

[ledgers]
cgst = Output CGST
sgst = Output SGST
igst = Output IGST
hole = Hole
cutout = Cutout
big_hole = Big Hole
big_cutout = Big Cutout
freight = Freight Charges
document_charge = Document Charge
roundoff = Round Off

[files]
; ERP exports (.csv, .xls or .xlsx), relative to this folder or a full path
header = header_example.csv
items = items_example.csv
pi = pi_example.csv
mapping = glass_mapping_example.csv
party_mapping = party_mapping_example.csv
; the program's memory of sent bills: use one file per Tally company
sent_list = tally_sent_example.db

[safety]
; bills with a lower ERP number are never sent (0 = off; live mode refuses 0)
start_from_invoice = 0
; yes = refuses --test-date, --create-parties and --fallback-item
live_mode = no
infer_document_charge = yes
document_charge_max = 100

[gst]
; yes = write the party's state, GST type and place of supply into every bill
party_details = no